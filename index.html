<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>おしよせ！かいぶつ</title>
<meta name="description" content="おしよせる怪物をタップで追いかえせ！1回1分、つい「もう1回」になるタップゲーム。">
<meta name="theme-color" content="#5a5b9e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" class="stage">
  <canvas id="game"></canvas>

  <!-- プレイ中の表示 -->
  <header id="hud" class="hud" hidden>
    <div class="hud-left">
      <div class="score" id="score">0</div>
      <div class="best">ベスト <span id="hud-best">0</span></div>
    </div>
    <div class="lives" id="lives" aria-label="ライフ"></div>
    <button class="icon-btn" id="btn-pause" aria-label="一時停止">
      <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </header>
  <div id="combo" class="combo" aria-live="polite"></div>
  <div id="banner" class="banner"></div>
  <div id="ammo" class="ammo" hidden aria-label="のこりの玉"></div>

  <!-- スタート画面 -->
  <section id="start" class="panel start">
    <p class="kicker">タップで追いかえせ！</p>
    <h1 class="title">おしよせ！<br><span>かいぶつ</span></h1>
    <p class="best-line">ベスト <b id="start-best">0</b></p>
    <ul class="howto" id="howto"></ul>
    <button class="btn-big" id="btn-start" disabled>じゅんび中…</button>
    <button class="sound-btn" id="btn-sound"></button>
  </section>

  <!-- 一時停止 -->
  <section id="pause" class="panel small" hidden>
    <h2>ひとやすみ</h2>
    <button class="btn-big" id="btn-resume">つづける</button>
    <button class="btn-sub" id="btn-quit">やめてタイトルへ</button>
  </section>

  <!-- ゲームオーバー -->
  <section id="over" class="panel over" hidden>
    <p class="kicker">ゲームオーバー</p>
    <div class="final" id="final">0</div>
    <p class="record" id="record" hidden>ベスト更新！</p>
    <p class="rank" id="rank"></p>
    <dl class="stats">
      <div><dt>たおした数</dt><dd id="st-kills">0</dd></div>
      <div><dt>最大コンボ</dt><dd id="st-combo">0</dd></div>
      <div><dt>ベスト</dt><dd id="st-best">0</dd></div>
    </dl>
    <button class="btn-big" id="btn-retry">もう1回！</button>
    <button class="btn-sub" id="btn-title">タイトルへ</button>
  </section>
</div>

<script src="art.js"></script>
<script src="script.js"></script>
</body>
</html>
