<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運動でモンスターを倒すダイエットゲーム（MVP）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== スタート画面 ===== -->
<section id="screen-start" class="screen active">
  <div id="start-visual" class="start-visual"></div>
  <h1 class="start-title">運動でモンスターを<br>倒す冒険</h1>
  <p class="start-tagline">運動して、怪物を退治しよう！</p>
  <button id="btn-start" class="btn btn-attack">はじめる</button>
</section>

<!-- ===== セーブスロット選択画面 ===== -->
<section id="screen-slots" class="screen">
  <h1>運動でモンスターを倒す<br>ダイエットゲーム</h1>
  <p class="sub">セーブスロットを選んでください</p>
  <div id="slot-list" class="slot-list"></div>
</section>

<!-- ===== 新規プレイヤー名入力画面 ===== -->
<section id="screen-newplayer" class="screen">
  <h2>新しい冒険者の名前は？</h2>
  <input id="new-player-name" type="text" maxlength="10" placeholder="なまえ（10文字まで）">
  <div class="btn-row">
    <button id="btn-create-cancel" class="btn btn-sub">もどる</button>
    <button id="btn-create-confirm" class="btn btn-main">はじめる</button>
  </div>
</section>

<!-- ===== ゲーム画面 ===== -->
<section id="screen-game" class="screen">
  <header class="game-header">
    <div class="player-info">
      <span id="player-name">-</span>
      <span id="player-level">Lv.1</span>
    </div>
    <button id="btn-back-slots" class="btn btn-small">スロット選択へ</button>
  </header>

  <div class="monster-area">
    <div id="monster-sprite" class="monster-sprite"></div>
    <div class="monster-name" id="monster-name">スライム</div>

    <div class="hp-bar-wrap">
      <div class="hp-bar-bg">
        <div id="hp-bar-fill" class="hp-bar-fill"></div>
      </div>
      <div id="hp-text" class="hp-text">100 / 100</div>
    </div>

    <div id="damage-popup" class="damage-popup"></div>
    <div id="defeat-banner" class="defeat-banner">討伐！</div>
  </div>

  <div class="stats-row">
    <div class="stat-box">攻撃力<br><span id="stat-attack">-</span></div>
    <div class="stat-box">討伐数<br><span id="stat-defeat">-</span></div>
    <div class="stat-box">記録回数<br><span id="stat-records">-</span></div>
  </div>

  <div class="action-area">
    <div class="exercise-input">
      <select id="exercise-select" class="exercise-select"></select>
      <div class="amount-row">
        <input id="exercise-amount" type="number" min="1" step="1" value="10" class="exercise-amount">
        <span id="exercise-unit" class="exercise-unit">回</span>
      </div>
    </div>
    <button id="btn-record" class="btn btn-attack">記録して攻撃する！</button>
  </div>

  <div class="menu-suggest-area">
    <button id="btn-suggest-menu" class="btn btn-sub">今日の運動メニューを提案してもらう</button>
    <div id="menu-suggest-result" class="menu-suggest-result"></div>
  </div>

  <div class="sub-actions">
    <button id="btn-open-items" class="btn btn-small">🎒 もちもの</button>
  </div>

  <div class="history-area">
    <h3>運動記録</h3>
    <ul id="history-list" class="history-list"></ul>
  </div>
</section>

<!-- ===== もちもの画面 ===== -->
<section id="screen-items" class="screen">
  <h2>もちもの</h2>
  <p class="sub">怪物を退治して手に入れたおとしもの</p>
  <ul id="items-list" class="items-list"></ul>

  <button id="btn-items-back" class="btn btn-main" style="width:100%;margin-top:16px;">もどる</button>
</section>

<script src="script.js"></script>
</body>
</html>
